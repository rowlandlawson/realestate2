<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Sign Up - PropInvest</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Nunito+Sans:200,300,400,700,900|Roboto+Mono:300,400,500"> 
    <link rel="stylesheet" href="fonts/icomoon/style.css">

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    
    <style>
      .signup-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 20px 0;
      }

      .signup-card {
        background: white;
        border-radius: 10px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 500px;
        padding: 40px;
      }

      .signup-header {
        text-align: center;
        margin-bottom: 30px;
      }

      .signup-header h1 {
        font-size: 32px;
        font-weight: 700;
        color: #333;
        margin-bottom: 10px;
      }

      .signup-header p {
        color: #666;
        font-size: 14px;
      }

      .form-group {
        margin-bottom: 18px;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: 600;
        font-size: 14px;
      }

      .form-group input,
      .form-group select {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 14px;
        transition: border-color 0.3s;
        font-family: inherit;
      }

      .form-group input:focus,
      .form-group select:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }

      .terms {
        margin-bottom: 20px;
        font-size: 13px;
        color: #666;
      }

      .terms input {
        margin-right: 8px;
      }

      .terms a {
        color: #667eea;
        text-decoration: none;
      }

      .terms a:hover {
        text-decoration: underline;
      }

      .signup-btn {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        margin-bottom: 15px;
      }

      .signup-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
      }

      .divider {
        text-align: center;
        margin: 20px 0;
        color: #ccc;
        font-size: 14px;
      }

      .social-signup {
        display: flex;
        gap: 10px;
      }

      .social-btn {
        flex: 1;
        padding: 10px;
        border: 1px solid #ddd;
        background: white;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: all 0.3s;
        text-decoration: none;
        color: #333;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .social-btn:hover {
        border-color: #667eea;
        color: #667eea;
      }

      .login-link {
        text-align: center;
        color: #666;
        font-size: 14px;
      }

      .login-link a {
        color: #667eea;
        font-weight: 600;
        text-decoration: none;
      }

      .login-link a:hover {
        text-decoration: underline;
      }

      .back-to-home {
        position: absolute;
        top: 20px;
        left: 20px;
      }

      .back-to-home a {
        color: white;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 5px;
        transition: gap 0.3s;
      }

      .back-to-home a:hover {
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <div class="back-to-home">
      <a href="index.html">← Back to Home</a>
    </div>

    <div class="signup-container">
      <div class="signup-card">
        <div class="signup-header">
          <h1>PropInvest</h1>
          <p>Create your investment account</p>
        </div>

        <form id="signupForm">
          <div class="form-row">
            <div class="form-group">
              <label for="firstName">First Name</label>
              <input type="text" id="firstName" name="firstName" placeholder="John" required>
            </div>
            <div class="form-group">
              <label for="lastName">Last Name</label>
              <input type="text" id="lastName" name="lastName" placeholder="Doe" required>
            </div>
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000" required>
          </div>

          <div class="form-group">
            <label for="accountType">Account Type</label>
            <select id="accountType" name="accountType" required>
              <option value="">Select account type</option>
              <option value="investor">Investor</option>
              <option value="buyer">Property Buyer</option>
              <option value="both">Investor & Buyer</option>
            </select>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Minimum 8 characters" required>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" required>
          </div>

          <div class="terms">
            <label style="display: flex; align-items: flex-start; gap: 10px; margin: 0; font-weight: 400;">
              <input type="checkbox" id="terms" name="terms" style="width: auto; margin-top: 2px;" required>
              <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
            </label>
          </div>

          <button type="submit" class="signup-btn">Create Account</button>
        </form>

        <div class="divider">Or sign up with</div>

        <div class="social-signup">
          <button class="social-btn" type="button">
            <span>f</span> Facebook
          </button>
          <button class="social-btn" type="button">
            <span>G</span> Google
          </button>
        </div>

        <div class="login-link">
          Already have an account? <a href="login.html">Sign in here</a>
        </div>
      </div>
    </div>

    <script src="js/jquery-3.3.1.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script>
      document.getElementById('signupForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        
        if (password !== confirmPassword) {
          alert('Passwords do not match!');
          return;
        }

        if (password.length < 8) {
          alert('Password must be at least 8 characters long!');
          return;
        }

        const firstName = document.getElementById('firstName').value;
        const email = document.getElementById('email').value;
        alert('Sign up attempt for: ' + firstName + ' (' + email + ')\n\nNote: Backend not implemented yet.');
      });
    </script>
  </body>
</html>
